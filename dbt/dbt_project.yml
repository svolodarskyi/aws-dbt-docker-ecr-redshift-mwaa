name: 'data_platform'
version: '1.0.0'
config-version: 2

profile: 'data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"
  - "logs"

models:
  data_platform:
    # External tables (S3 sources)
    external:
      +materialized: external
      +schema: raw_schema

    # Staging models
    staging:
      +materialized: view
      +schema: staging_schema
      +tags: ['staging']

    # Intermediate models
    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']

    # Marts (dimensional models)
    marts:
      +materialized: table
      +schema: analytics_schema
      +tags: ['marts']
      dimensions:
        +materialized: table
      facts:
        +materialized: incremental
        +on_schema_change: "sync_all_columns"
        +unique_key: "id"

seeds:
  +schema: seed_data

snapshots:
  +target_schema: snapshots
  +unique_key: id
  +strategy: timestamp
  +updated_at: updated_at

vars:
  start_date: '2024-01-01'
  end_date: '2026-12-31'

on-run-start:
  - "{{ log('Starting dbt run...', info=True) }}"

on-run-end:
  - "{{ log('dbt run completed!', info=True) }}"
